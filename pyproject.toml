[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engtools"
version = "0.3.0"
description = "LanguageWire Engineering toolbox — Python CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
engtools = "engtools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engtools*"]
