# ====================================================================================
# TmxTextToTag properties - configuration for class TmxRegXTextToTag.
#
# TmxRegXTextToTag allows to escape text in TMX segments as tags.
# 
# How TmxRegXTextToTag applies the expressions:
# 1) All TUVs are converted to an xml encoded string.
# 2) All expressions are run on that string in the order they are specified below. 
#    Each result is feed into the next expression. Expressions are not combined.
# 3) The matched text is wrapped in <ph>...</ph>.
# 4) When a tuv is altered, the original tuv is detached and a new one created 
#    from the xml string.
# 5) Alterations are reported to the html log.
#
# Static rules:
# The code will enforce these rules automatically:
#  1) A newly created tag will not be allowed to wrap any pre-existing tag 
#     (fully or partially).
#  2) A newly created tag will not be allowed to be placed within text  
#     that is wrapped by a pre-existing tags.

# NOTE: Both of these rules prevent more than one user defined expression 
#       from matching a given run. This is where you may have to play with 
#       the order of your active converter expressions.
# NOTE: You must use string literals in place of XML entities.
#        For Example, to match this text: 
#			 &lt;link word&gt; 
#        Use:
#            tmx.texttotag.myexpression1=</?link word>
# ====================================================================================

# Active expressions, run in the order they are listed here.
# Expression names are separated by a comma, for example: html,skype1,expression2
tmx.texttotag.converters.active=skypeA,skypeB,skype1,skype2,skype3,skype4,skype5

tmx.texttotag.skypeA=(<|&lt;).*?(>|&gt;)
#tmx.texttotag.skypeB=&[^;]+;
tmx.texttotag.skypeB=\\$\\{.*\\}

tmx.texttotag.skype1=%[sd]
tmx.texttotag.skype2=#\\{.*?\\}
tmx.texttotag.skype3=#.*?#
tmx.texttotag.skype4=\\[.*?\\]
tmx.texttotag.skype5=\\{[^\\{]*?\\}

# eof
